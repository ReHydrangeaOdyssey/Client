[package]
name = "reorsg-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cridecoder = { version = "=0.3.6", default-features = false }
game_logic = { package = "GameLogic", path = "GameLogic" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

js-sys = "0.3"
wasm-bindgen-futures = "0.4"

web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestCache", "RequestRedirect", "Headers", "Response", "AbortSignal"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
